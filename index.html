<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Presença - Aluno</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .no-select {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-dvh flex flex-col justify-between no-select" oncontextmenu="return false;">

    <!-- HEADER -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 shadow-md sticky top-0 z-30">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600 p-2 rounded-lg text-white font-bold">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
                    </svg>
                </div>
                <div>
                    <h1 class="text-base font-bold tracking-tight">Registro de Presença</h1>
                    <p class="text-xs text-slate-400">Portal do Aluno (Com GPS)</p>
                </div>
            </div>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="max-w-md w-full mx-auto p-4 flex-grow flex flex-col justify-center">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl w-full">
            <div class="text-center mb-6">
                <span class="inline-block bg-indigo-500/10 text-indigo-400 text-xs font-semibold px-3 py-1 rounded-full mb-2">
                    Data do Registro
                </span>
                <h2 id="displayDateText" class="text-2xl font-bold tracking-tight text-white">--/--/----</h2>
                <p class="text-xs text-slate-400 mt-1">Permita o acesso à localização para confirmar sua presença</p>
            </div>

            <!-- FORM OR CLOSED NOTICE -->
            <div id="attendanceContainer">
                <form id="attendanceForm" onsubmit="handleAttendanceSubmit(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Seu RA</label>
                        <input type="text" id="inputRA" required placeholder="Ex: 123456" 
                            class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-base min-h-[50px]">
                    </div>

                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider">Chave Diária (15 Dígitos)</label>
                            <span id="charCount" class="text-xs text-slate-500 font-mono">0/15</span>
                        </div>
                        <input type="text" id="inputKey" required maxlength="15" placeholder="Cole a chave de 15 caracteres" oninput="updateKeyCounter(this)"
                            class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 font-mono text-base tracking-wider min-h-[50px]">
                    </div>

                    <button type="submit" id="submitBtn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3.5 px-4 rounded-xl transition shadow-lg shadow-indigo-600/30 text-base flex items-center justify-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                        </svg>
                        Verificar Local e Confirmar
                    </button>
                </form>
            </div>

            <div id="closedNotice" class="hidden text-center py-6 space-y-3">
                <div class="text-amber-400 font-semibold text-sm">Data inválida ou não informada</div>
                <p class="text-xs text-slate-400">Certifique-se de escanear o QR Code oficial fornecido pelo professor.</p>
            </div>

            <div id="feedbackMessage" class="mt-4 hidden p-3 rounded-xl text-sm font-medium text-center"></div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-slate-800/50 border-t border-slate-800 p-4 text-center text-xs text-slate-500">
        Sistema Escolar &bull; Validação por Geolocalização
    </footer>

    <!-- SCRIPT DO ALUNO COM GPS -->
    <script>
        const VALID_KEYS = {
            "18/11/2026": "K9$mP2#xQ7@vL4&",
            "23/11/2026": "R4@wN8%tZ1#jB6$",
            "24/11/2026": "M7&pY3$kf9@cH2%",
            "25/11/2026": "V2#qD6&nX5%gT8@",
            "26/11/2026": "W5%bJ9@rS4$zM1#",
            "27/11/2026": "X8$hG2%vC7&pK3@"
        };

        // ENDEREÇOS AUTORIZADOS (Latitude e Longitude)
        const AUTHORIZED_LOCATIONS = [
            { name: "Rua Augusta, 1508", lat: -23.555812, lng: -46.658245 },
            { name: "Rua Borges de Figueiredo, 510 - Mooca", lat: -23.553920, lng: -46.602810 }
        ];

        const MAX_DISTANCE_METERS = 500;
        let targetDate = "";

        window.addEventListener('DOMContentLoaded', () => {
            initTargetDate();
        });

        function initTargetDate() {
            const urlParams = new URLSearchParams(window.location.search);
            const dateParam = urlParams.get('data');

            if (dateParam && VALID_KEYS[dateParam]) {
                targetDate = dateParam;
            } else {
                const now = new Date();
                const dd = String(now.getDate()).padStart(2, '0');
                const mm = String(now.getMonth() + 1).padStart(2, '0');
                const yyyy = now.getFullYear();
                const todayStr = `${dd}/${mm}/${yyyy}`;
                
                if (VALID_KEYS[todayStr]) {
                    targetDate = todayStr;
                }
            }

            if (targetDate && VALID_KEYS[targetDate]) {
                document.getElementById('displayDateText').innerText = targetDate;
            } else {
                document.getElementById('attendanceContainer').classList.add('hidden');
                document.getElementById('closedNotice').classList.remove('hidden');
                document.getElementById('displayDateText').innerText = "Indisponível";
            }
        }

        function updateKeyCounter(input) {
            const count = input.value.length;
            document.getElementById('charCount').innerText = `${count}/15`;
        }

        function handleAttendanceSubmit(e) {
            e.preventDefault();
            const ra = document.getElementById('inputRA').value.trim();
            const key = document.getElementById('inputKey').value.trim();

            if (!targetDate || !VALID_KEYS[targetDate]) {
                showFeedback("Data de registro inválida.", "error");
                return;
            }

            if (!ra || !key) {
                showFeedback("Preencha todos os campos obrigatórios.", "error");
                return;
            }

            if (key.length !== 15) {
                showFeedback("A chave deve ter exatamente 15 caracteres.", "error");
                return;
            }

            if (key !== VALID_KEYS[targetDate]) {
                showFeedback("Chave diária inválida para esta data.", "error");
                return;
            }

            // Validar Geolocalização antes de salvar
            if (!navigator.geolocation) {
                showFeedback("Seu navegador não suporta geolocalização.", "error");
                return;
            }

            showFeedback("Obtendo sua localização GPS...", "success");
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    submitBtn.disabled = false;
                    const studentLat = position.coords.latitude;
                    const studentLng = position.coords.longitude;

                    // Verificar distância para os locais permitidos
                    let minDistance = Infinity;
                    let nearestLocation = "";

                    AUTHORIZED_LOCATIONS.forEach(loc => {
                        const dist = calculateDistanceMeters(studentLat, studentLng, loc.lat, loc.lng);
                        if (dist < minDistance) {
                            minDistance = dist;
                            nearestLocation = loc.name;
                        }
                    });

                    if (minDistance <= MAX_DISTANCE_METERS) {
                        // Dentro do raio de 500m! Salvar presença.
                        saveAttendanceRecord(targetDate, ra);
                    } else {
                        showFeedback(`Localização negada: Você está a aproximadamente ${Math.round(minDistance)}m do local permitido mais próximo (${nearestLocation}). O limite é 500m.`, "error");
                    }
                },
                (error) => {
                    submitBtn.disabled = false;
                    let errorMsg = "Erro ao obter localização.";
                    if (error.code === error.PERMISSION_DENIED) {
                        errorMsg = "Permissão de GPS negada. Ative a localização nas configurações do seu celular para registrar a presença.";
                    } else if (error.code === error.POSITION_UNAVAILABLE) {
                        errorMsg = "Informações de localização indisponíveis.";
                    } else if (error.code === error.TIMEOUT) {
                        errorMsg = "Tempo esgotado ao buscar o sinal de GPS.";
                    }
                    showFeedback(errorMsg, "error");
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }

        // Fórmula de Haversine para calcular distância em metros entre duas coordenadas GPS
        function calculateDistanceMeters(lat1, lon1, lat2, lon2) {
            const R = 6371e3; // Raio da Terra em metros
            const φ1 = lat1 * Math.PI/180;
            const φ2 = lat2 * Math.PI/180;
            const Δφ = (lat2-lat1) * Math.PI/180;
            const Δλ = (lon2-lon1) * Math.PI/180;

            const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                      Math.cos(φ1) * Math.cos(φ2) *
                      Math.sin(Δλ/2) * Math.sin(Δλ/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

            return R * c; // Distância em metros
        }

        function saveAttendanceRecord(date, ra) {
            let records = JSON.parse(localStorage.getItem('attendance_records_nov2026') || '[]');
            const exists = records.some(r => r.date === date && r.ra === ra);

            if (exists) {
                showFeedback(`O RA ${ra} já possui presença registrada em ${date}.`, "error");
                return;
            }

            records.push({ date: date, ra: ra });
            localStorage.setItem('attendance_records_nov2026', JSON.stringify(records));

            showFeedback(`Presença confirmada com sucesso via GPS para o RA ${ra} em ${date}!`, "success");
            document.getElementById('attendanceForm').reset();
            document.getElementById('charCount').innerText = "0/15";
        }

        function showFeedback(msg, type) {
            const fb = document.getElementById('feedbackMessage');
            fb.classList.remove('hidden', 'bg-emerald-500/10', 'text-emerald-400', 'border', 'border-emerald-500/30', 'bg-rose-500/10', 'text-rose-400', 'border-rose-500/30');
            if (type === 'success') {
                fb.classList.add('bg-emerald-500/10', 'text-emerald-400', 'border', 'border-emerald-500/30');
            } else {
                fb.classList.add('bg-rose-500/10', 'text-rose-400', 'border', 'border-rose-500/30');
            }
            fb.innerText = msg;
            setTimeout(() => { fb.classList.add('hidden'); }, 8000);
        }

        // Proteções anti-inspeção
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if (e.key === 'F12' || (e.ctrlKey && e.key === 'F12') || (e.ctrlKey && e.shiftKey && ['I', 'J', 'C'].includes(e.key.toUpperCase())) || (e.ctrlKey && e.key.toUpperCase() === 'U')) {
                e.preventDefault();
                e.stopPropagation();
                return false;
            }
        });
    </script>
</body>
</html>
